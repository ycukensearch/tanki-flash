<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Танки Флэш</title>
    <style>
        body { margin: 0; background: #111; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        ruffle-player { width: 100vw; height: 100vh; max-width: 800px; max-height: 600px; }
    </style>
</head>
<body>
   <h1>Танки Флэш</h1>
    <audio id="bg-audio" loop muted>
  <source src="https://ycukensearch.github.io/tanki-flash/ost.mp3" type="audio/mpeg">
</audio>
<button onclick="document.getElementById('bg-audio').play()">Включить фоновую музыку</button>  
    <div id="msg">Загрузка эмулятора Ruffle...</div>
    <script>
        const domain = ["unpkg", "com"].join(".");
        const pkg = ["", "@ruffle-rs", "ruffle"].join("/");
        const s = document.createElement("script");
        s.src = "https:/" + "/" + domain + pkg;
        s.onload = () => {
            document.getElementById("msg").style.display = "none";
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            document.body.appendChild(player);
            player.load("tanks.swf");
        };
        s.onerror = () => {
            document.getElementById("msg").textContent = "Ошибка загрузки Ruffle";
        };
        document.body.appendChild(s);
    </script>
</body>
</html>
