<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Танки Flash (Ruffle)</title>
    <style>
        body { margin: 0; background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        ruffle-player { width: 100vw; height: 100vh; max-width: 800px; max-height: 600px; }
    </style>
    <script src="https://unpkg.com"></script>
</head>
<body>
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.addEventListener("load", () => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            document.body.appendChild(player);
            player.load("tanks.swf");
        });
    </script>
</body>
</html>
